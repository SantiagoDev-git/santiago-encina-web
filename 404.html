<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada — Portal de Lectura</title>
    <style>
        body {
            background-color: #0f172a; /* Fondo oscuro elegante */
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .error-codigo {
            font-size: 5rem;
            font-weight: 700;
            color: #cbd5e1;
            margin: 0;
            line-height: 1;
        }
        .error-titulo {
            font-size: 1.5rem;
            margin-top: 15px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .error-texto {
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 1rem;
            max-width: 400px;
            line-height: 1.5;
        }
        .btn-inicio {
            background-color: #b45309; /* Tono acorde a tus botones de lectura */
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .btn-inicio:hover {
            background-color: #92400e;
        }
    </style>
</head>
<body>
    <div class="error-codigo">404</div>
    <div class="error-titulo">Página no encontrada</div>
    <p class="error-texto">Lo que buscás no está aquí, o la dirección ha cambiado. Volvé al inicio para continuar tu lectura.</p>
    <a href="index.html" class="btn-inicio">Volver al Inicio</a>
</body>
</html>
